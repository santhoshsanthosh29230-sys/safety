services:
  - type: web
    name: safety-surveillance
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python app.py --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: 10000
